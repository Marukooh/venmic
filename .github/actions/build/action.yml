name: "🏗️ Build Addon"
description: "Runs the given command using the build container"

inputs:
  arch:
    default: amd64
    description: Either 'amd64' or 'arm64'

  command:
    required: true
    description: The command to run 

runs:
  using: "composite"
  steps:
      - name: ⌛ Wait for Image
        uses: kachick/wait-other-jobs@v4
        with:
          wait-list: |
            [
              {
                "workflowFile": "image.yml",
                "optional": true
              }
            ]

      - name: 🏗️ Build
        shell: bash
        run: docker run -v ${{ github.workspace }}:/work --platform linux/${{ inputs.arch }} ghcr.io/vencord/venmic-builder-${{ inputs.arch }}:latest "${{ inputs.command }}"
