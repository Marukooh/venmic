on:
  push:
    paths:
      - flake.nix
      - docker/Dockerfile

  workflow_dispatch:
    inputs:
      skip-cache:
        type: boolean
        description: Skip Cache

name: 🐳 Build & Publish Docker Image

jobs:
  build-container:
    strategy:
      matrix:
        arch: ["arm64", "amd64"]

    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7

      - name: 🤖 Setup Qemu
        uses: docker/setup-qemu-action@v3
        with:
          platforms: "arm64"

      - name: 🐋 Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🦥 Cache Image
        id: cache-image
        uses: actions/cache@v6
        if: ${{ github.event.inputs.skip-cache != 'true' }} 
        with:
          key: venmic-builder-cache-${{ matrix.arch }}
          path: venmic-builder-${{ matrix.arch }}.tar

      - name: 🏗️ Build Image
        if: ${{ steps.cache-image.outputs.cache-hit != 'true' }}
        run: |
          # Prepare...
          mv docker/Dockerfile .

          # Build...
          docker buildx build --platform=linux/${{ matrix.arch }} --tag venmic-builder-${{ matrix.arch }} --load .
          docker save venmic-builder-${{ matrix.arch }} > venmic-builder-${{ matrix.arch }}.tar

      - name: 🔐 Login
        uses: docker/login-action@v4
        if: ${{ steps.cache-image.outputs.cache-hit != 'true' }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: ♻️ Publish Images
        if: ${{ steps.cache-image.outputs.cache-hit != 'true' }}
        run: |
          # Prepare...
          docker load < venmic-builder-${{ matrix.arch }}.tar
          docker image tag venmic-builder-${{ matrix.arch }} ghcr.io/vencord/venmic-builder-${{ matrix.arch }}

          # Upload...
          docker push ghcr.io/vencord/venmic-builder-${{ matrix.arch }}:latest
